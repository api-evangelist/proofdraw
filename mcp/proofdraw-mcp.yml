tools:
  - name: create_instant_draw
    description: >-
      Create a draw, attach entries, and seal it in one atomic call — optionally waiting for the drand
      round and returning the resolved winner.
    source_operation: openapi/proofdraw-api-openapi.yml#POST /v1/draws/instant
    consequence: >-
      Irreversible once sealed. Consumes a unit of the account's draw quota (lifetime-capped at 5 on the
      free tier) and publishes the entry list to a public GitHub mirror. No idempotency key exists, so a
      retried call creates a SECOND public draw.
  - name: create_draw
    description: Create an open draw without entries.
    source_operation: openapi/proofdraw-api-openapi.yml#POST /v1/draws
  - name: add_draw_entries
    description: Add up to 5,000 entries to an open draw, atomically per call.
    source_operation: openapi/proofdraw-api-openapi.yml#POST /v1/draws/{id}/entries
  - name: seal_draw
    description: >-
      Freeze the draw, hash the canonical list with the chosen future drand round, push it to the public
      mirror, and submit the hash for OpenTimestamps attestation.
    source_operation: openapi/proofdraw-api-openapi.yml#POST /v1/draws/{id}/seal
    consequence: Irreversible. The public commitment cannot be deleted afterwards.
  - name: resolve_draw
    description: Force resolution of a sealed draw once its drand round has published.
    source_operation: openapi/proofdraw-api-openapi.yml#POST /v1/draws/{id}/resolve
    idempotent: true
  - name: get_draw
    description: Fetch one draw in its current state.
    source_operation: openapi/proofdraw-api-openapi.yml#GET /v1/draws/{id}
  - name: list_draws
    description: List the caller's 100 most recent draws (silently truncated beyond that).
    source_operation: openapi/proofdraw-api-openapi.yml#GET /v1/draws
  - name: cancel_draw
    description: Cancel and soft-delete an OPEN draw. Returns 409 once sealed.
    source_operation: openapi/proofdraw-api-openapi.yml#DELETE /v1/draws/{id}
  - name: get_account
    description: Read the account, current-period usage, and tier limits — the quota preflight.
    source_operation: openapi/proofdraw-api-openapi.yml#GET /v1/me
  - name: get_sealed_list
    description: Download the raw content-addressed sealed entry list for a hash. Public, no auth.
    source_operation: openapi/proofdraw-api-openapi.yml#GET /list/{hash}
  - name: get_ots_proof
    description: Download the OpenTimestamps proof for a sealed list hash. Public, no auth.
    source_operation: openapi/proofdraw-api-openapi.yml#GET /list/{hash}/ots
  - name: health
