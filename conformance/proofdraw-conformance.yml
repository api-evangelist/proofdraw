  note: >-
    No SOC 2, ISO 27001, PCI DSS, HIPAA, FedRAMP or GDPR compliance claim is published, and no trust
    center exists (trust./security. subdomains and /trust, /security, /compliance all miss). This is a
    notable gap against the company's own stated market: the About and Careers copy names "regulated
    sweepstakes operators" and "compliance constraints" as the target buyer, and a Terms and Privacy
    Policy are the only governance documents published.
