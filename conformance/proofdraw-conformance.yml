  - id: json-api
    conforms: false
    evidence: Custom envelope, not JSON:API media type or structure.
  - id: idempotency-key
    conforms: false
    evidence: >-
      No Idempotency-Key header or equivalent. Only POST /v1/draws/{id}/resolve is documented as naturally
      idempotent. See conventions/proofdraw-conventions.yml.
  - id: pagination
    conforms: false
    evidence: >-
      GET /v1/draws caps silently at the 100 most recent draws with no cursor, offset, page-size parameter,
