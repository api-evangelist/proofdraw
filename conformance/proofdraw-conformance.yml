  - id: rate-limit-headers
    conforms: partial
    evidence: >-
      X-RateLimit-Limit / X-RateLimit-Remaining are documented in the OpenAPI info.description (the
      pre-standard X- form, not the IETF `RateLimit` draft fields), but no numeric limits and no 429
      response are published, and no headers were observed on the anonymous /api/health response.
  - id: drand-league-of-entropy
    conforms: true
    evidence: >-
      Randomness is sourced from the drand public beacon operated by the League of Entropy (Cloudflare,
      EPFL, University of Chile, Kudelski Security and others). Two chains selectable per draw:
      `quicknet` (3s rounds, genesis 1692803367) and `classic` (30s rounds, genesis 1595431050). The chain
      and round are named in the sealed file header, so the round cannot be reinterpreted after the fact.
  - id: opentimestamps
    conforms: true
    evidence: >-
      Every sealed list hash is submitted to an OpenTimestamps calendar at seal time and upgraded to a
      Bitcoin block anchor within ~24h. The proof is downloadable at GET /list/{hash}/ots and verifies with
      the standard `ots verify` CLI. Documented at https://proofdraw.com/docs/opentimestamps.
      Attestation is explicitly best-effort — a missing .ots is a documented state, not a failure.
  - id: sha-256-commitment
    conforms: true
    evidence: >-
      Canonical v2 list bytes (UTF-8, LF, header lines naming format version, draw id, chain, round,
      round_time and entry count, then ticket ids one per line) are hashed with SHA-256; the URL of the
      public read IS the hash, so re-hashing the response is itself the check.
  - id: hmac-sha256-webhook-signing
    conforms: true
    evidence: 'X-ProofDraw-Signature: sha256=<hex>, keyed by the per-draw callback_secret.'
  - id: content-signals-ai-preferences
    conforms: true
    evidence: >-
      robots.txt publishes Content-Signal `search=yes,ai-train=no,use=reference` plus explicit Disallow
      for ClaudeBot, GPTBot, CCBot, Google-Extended, Applebot-Extended, Bytespider, Amazonbot and
      meta-externalagent. A machine-readable AI-usage reservation, Cloudflare-managed.
regulatory:
  certifications: []
