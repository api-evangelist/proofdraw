name: ProofDraw
description: >-
  Provably-fair random selection REST API that seals entry lists with SHA-256 commitments bound to future
  drand (League of Entropy) randomness rounds, producing publicly verifiable draw receipts with
  client-side open-source verification. A draw is created, entries are added as opaque ticket ids, then
  sealed against a chosen future beacon round on the quicknet (3s) or classic (30s) chain; the canonical
  list file is hashed, mirrored to a public GitHub repository, and anchored with OpenTimestamps, so any
  entrant can re-derive the winner in their own browser from public sources alone. Serves giveaways,
  raffles and sweepstakes, non-profit draws, audit sample selection and task allocation, with
  HMAC-signed webhooks and bearer API-key authentication.
