durability_commitments:
  - claim: Sealed draws are permanent and cannot be deleted or modified
    mechanism: >-
      DELETE /v1/draws/{id} returns 409 state_conflict once sealed; the list file is pushed to
      github.com/proofdraw/draw-lists and OpenTimestamps-attested at seal.
    source: https://proofdraw.com/api
  - claim: Verification survives ProofDraw going offline
    mechanism: >-
      "We designed this so that ProofDraw going offline wouldn't break a single verification" — the sealed
      lists are mirrored to a public GitHub repo, the randomness comes from the League of Entropy drand
      chain, and the verifier is MIT-licensed and client-side. Publicly stated design commitment on
      https://proofdraw.com/about; not an SLA.
    source: https://proofdraw.com/about
  - claim: OpenTimestamps proofs upgrade to a Bitcoin anchor within ~24h
    mechanism: background job `proofdraw:upgrade-ots`; calendar attestation is best-effort at seal time.
    source: https://proofdraw.com/docs/opentimestamps
